name: Daily Quiz Reminder

on:
  schedule:
    # Two crons cover both Melbourne timezones. Only one will pass the
    # local-hour check inside the job; the other becomes a no-op.
    - cron: '45 18 * * *'  # 5:45 AEDT (summer, UTC+11)
    - cron: '45 19 * * *'  # 5:45 AEST (winter, UTC+10)
  workflow_dispatch:        # also runnable manually from Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is 5:45 in Melbourne
        id: check
        run: |
          HOUR=$(TZ=Australia/Melbourne date +%H)
          echo "Melbourne hour is $HOUR"
          if [ "$HOUR" = "05" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check streak status
        if: steps.check.outputs.send == 'true'
        id: streak
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/streak/log.md" -o /tmp/log.md || echo "" > /tmp/log.md
          YESTERDAY=$(TZ=Australia/Melbourne date -d "yesterday" +%Y-%m-%d)
          if grep -q "^- $YESTERDAY:" /tmp/log.md; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi
          STREAK=$(python3 - <<'EOF'
          from datetime import date, timedelta
          try:
              entries = [l.split(":")[0].lstrip("- ").strip() for l in open("/tmp/log.md") if l.startswith("- 20")]
          except FileNotFoundError:
              entries = []
          dates = sorted(set(entries), reverse=True)
          streak, cursor = 0, date.today() - timedelta(days=1)
          for d in dates:
              if d == cursor.isoformat():
                  streak += 1
                  cursor -= timedelta(days=1)
              else:
                  break
          print(streak)
          EOF
          )
          echo "count=$STREAK" >> "$GITHUB_OUTPUT"

      - name: Send Telegram reminder
        if: steps.check.outputs.send == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAK: ${{ steps.streak.outputs.count }}
          ALIVE: ${{ steps.streak.outputs.alive }}
        run: |
          if [ "$ALIVE" = "true" ]; then
            STATUS="🔥 Streak alive: *$STREAK days*"
          else
            STATUS="💀 Streak broken — start a new one today"
          fi
          MSG="📚 *Good morning!*%0A%0ATime for CMU Graphics quiz questions.%0A%0A$STATUS%0A%0A🔗 https://dyakooo.github.io/cmu-computer-graphics%0A%0AAfter studying, log it:%0A\`python3 scripts/log_streak.py <count> <note>\`"
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$(printf '%b' "${MSG//%0A/\n}")"
